[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-analytics"
version = "0.1.0"
description = "F1 data pipeline: ingest → normalize → warehouse → analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0,<3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
dbt = ["dbt-core>=1.8,<2.0", "dbt-postgres>=1.8,<2.0"]
# Airflow runs in Docker (see Dockerfile.airflow + requirements-airflow.txt);
# do NOT pip install locally.
airflow = []
app = ["streamlit>=1.35", "plotly>=5.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true