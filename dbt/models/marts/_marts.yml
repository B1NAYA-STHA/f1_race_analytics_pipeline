      - name: constructor_name
        tests: [not_null]
      - name: first_season
        tests: [not_null]
      - name: last_season
        tests: [not_null]
      - name: seasons
        tests: [not_null]
      - name: races_entered
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: podiums
        tests: [not_null]
      - name: poles
        tests: [not_null]
      - name: fastest_laps
