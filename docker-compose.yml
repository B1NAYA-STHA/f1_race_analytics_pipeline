services:
  postgres:
    image: postgres:15-alpine
    container_name: f1_postgres
    environment:
      POSTGRES_DB: f1_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - f1_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the 'airflow' metadata database inside the existing postgres
  postgres-init:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres_password
    entrypoint: >
      sh -c "psql -h postgres -U postgres -d f1_warehouse
      -c 'CREATE DATABASE airflow' || true"
    networks:
      - f1_net

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: f1-airflow:2.10.5
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres_password@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: "f1-analytics-local-secret"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # Overrides so pipeline tasks reach postgres via service name.
      # python-dotenv does not override existing env vars, so these win over .env values.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: f1_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - .:/opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    restart: unless-stopped
    networks:
      - f1_net

  airflow-scheduler:
    image: f1-airflow:2.10.5
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - .:/opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    restart: unless-stopped
    networks:
      - f1_net

volumes:
  postgres_data:

networks:
  f1_net:
