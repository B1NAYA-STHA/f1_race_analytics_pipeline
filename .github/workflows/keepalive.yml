name: Supabase Keepalive

# Free-tier Supabase projects auto-pause after 7 days of no activity.
# This routine connection keeps the warehouse warm between weekly pipeline runs.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: f1-supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: require

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psycopg2
        run: pip install psycopg2-binary -q

      - name: Ping database
        run: |
          python -c "import os, psycopg2; c=psycopg2.connect(host=os.environ['POSTGRES_HOST'], port=int(os.environ['POSTGRES_PORT']), dbname=os.environ['POSTGRES_DB'], user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD'], sslmode=os.environ['POSTGRES_SSLMODE'], connect_timeout=30); cur=c.cursor(); cur.execute('select 1'); cur.fetchone(); c.commit(); c.close(); print('keepalive ok')"